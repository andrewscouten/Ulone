name: Export Obsidian to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Ulone/**'
      - '.github/workflows/deploy-pages.yml'

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export Obsidian vault to HTML
        run: |
          set +e
          mkdir -p ./output
          
          # Run the obsidian-webpage-export Docker container from GHCR
          # Mount the Ulone folder as /vault and output to ./output
          docker run --rm \
            -e EXPORT_ENTIRE_VAULT=true \
            -e EXPORT_PRESET=online \
            -v ${{ github.workspace }}/Ulone:/vault \
            -v ${{ github.workspace }}/output:/output \
            ghcr.io/andrewscouten/obsidian-webpage-export:latest
          
          # Check if export succeeded
          if [ $? -eq 137 ]; then
            echo "Export completed with memory limit warning (normal)"
          fi
          
          # Verify output was created
          ls -la ./output

      - name: Deploy to pages branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Fetch the pages branch or create it
          git fetch origin pages:pages 2>/dev/null || git checkout --orphan pages
          git checkout pages
          
          # Preserve CNAME file for custom domain if it exists on the pages branch
          if [ -f CNAME ]; then
            cp CNAME /tmp/CNAME
          fi
          
          # Remove old files
          git rm -rf . 2>/dev/null || true
          
          # Copy exported HTML files
          cp -r output/* .
          
          # Restore the CNAME file
          if [ -f /tmp/CNAME ]; then
            mv /tmp/CNAME .
          else
            echo "ulone.games-with-friends.org" > CNAME
          fi
          
          # Remove output directory so it isn't deployed
          rm -rf output
          
          # Add, commit, and push
          git add .
          git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin pages --force
